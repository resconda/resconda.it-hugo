<!-- home-latest.html: le ultime pillole (articoli) pubblicate, aggiornate in automatico -->
{{ $latest := where (where site.RegularPages "Section" "articles") "Draft" false }}
{{ $latest = $latest.ByDate.Reverse | first 6 }}
<section id="latest-articles">
    <h2 class="band-title">le ultime pillole</h2>
    <ul class="latest-list">
        {{ range $latest }}
        <li>
            <a class="latest-item" href="{{ .RelPermalink }}">
                <span class="latest-pill" aria-hidden="true"></span>
                <span class="latest-text">
                    <span class="latest-item-title" title="{{ .Title }}">{{ .Title }}</span>
                    <date>{{ .Date.Format "02.01.2006" }}</date>
                </span>
            </a>
        </li>
        {{ end }}
    </ul>
    <p class="band-more">
        <a href="{{ "articles/" | relLangURL }}">Tutte le pillole &rarr;</a>
    </p>
</section>
