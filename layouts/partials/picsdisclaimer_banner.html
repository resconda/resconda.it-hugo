<!-- Il banner è visibile da subito: lo script qui sotto lo nasconde, prima che la pagina venga disegnata, se è già stato chiuso.
     Prima era nascosto e veniva mostrato dopo il caricamento, spostando il resto della pagina (CLS). -->
<div id="picsdisclaimer-banner" class="alert alert-warning alert-dismissible fade show" role="alert">
    <div class="row justify-content-center">
        <div class="col-12 col-md-6" style="font-size:smaller;">
            {{ i18n "pics_disclaimer" | safeHTML }}
        </div>
    </div>
    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
</div>
<script>if(document.cookie.split(";").some(function(c){return c.trim().indexOf("picsDisclaimerBannerDismissed=")===0}))document.getElementById("picsdisclaimer-banner").classList.add("d-none");</script>
