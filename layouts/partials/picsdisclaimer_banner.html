<!-- we set this d-none by default as user may have dismissed the banner. JS script will check for dismissal cookie and, if not found, will remove the d-none class -->
<div id="picsdisclaimer-banner" class="d-none alert alert-warning alert-dismissible fade show" role="alert">
    <div class="row justify-content-center">
        <div class="col-12 col-md-6" style="font-size:smaller;">
            {{ i18n "pics_disclaimer" | safeHTML }}
        </div>
    </div>
    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
</div>
