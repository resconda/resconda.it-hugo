baseURL: /
languageCode: it-it
title: ResConDA

params:
  logo: "https://res.cloudinary.com/resconda-it/image/upload/v1646949774/assets/img/logo/favicon.png"
  header_image: "/images/limits.jpg"
  home_title: |
    Azione  
    consapevole
  slogan: |
    Associazione per la  
    **RES**tituzione **CON**sapevole   
    del **D**ebito **A**mbientale
  hero_slogan: |
    Associazione **RES**conda  
    per la restituzione **CON**sapevole  
    del **D**ebito **A**mbientale
  seo_home_title: "ResConDA – Quanta energia costano le scelte di ogni giorno"
  # I tag con meno articoli di questa soglia non vengono indicizzati da Google e non vanno in sitemap
  min_articles_index_tag: 5
    # Feed RSS del podcast: serve a mostrare l'ultimo episodio in home
  podcast_rss: "https://anchor.fm/s/e249a830/podcast/rss"
  description: "Quanta energia c’è in una lattina, in un volo, in un piatto di pasta? ResConDA misura in kWh l’impatto delle scelte quotidiane, con numeri e fonti."
  socials:
  - link: "https://facebook.com"
    name: facebook
    icon_tag: "<i class=\"fa-brands fa-facebook fa-2x\"></i>"
  - link: "https://twitter.com"
    name: twitter
    icon_tag: "<i class=\"fa-brands fa-twitter fa-2x\"></i>"
  - link: "https://linkedin.com"
    name: linkedin
    icon_tag: "<i class=\"fa-brands fa-linkedin fa-2x\"></i>"
  - link: "https://instagram.com"
    name: instagram
    icon_tag: "<i class=\"fa-brands fa-instagram fa-2x\"></i>"
  search: true
  search_minify: false
  # MathJax si carica solo nelle pagine con formule (vedi layouts/partials/head.html)
  math: false
  ext_links:
    subscription_form_person: https://form.jotform.com/242896877203368
    subscription_form_organization: https://form.jotform.com/243102285113342
  friendly_captcha:
    site_key: FCMNSLE4OV2OBU04

markup:
  goldmark:
    extensions:
      passthrough:
        delimiters:
          block:
          - - \[
            - \]
          - - $$
            - $$
          inline:
          - - \(
            - \)
        enable: true

outputs:
  home:
    - HTML
    - JSON
  taxonomy:
    - HTML
    - JSON
languages:
  it:
    languageName: Italiano
    weight: 1
    params:
      reading_speed: 188
    menus:
      main:
      - name: Home
        identifier: "home"
        pageRef: "/"
        weight: 1
      - name: News
        identifier: "articles"
        pageRef: "/articles"
        weight: 20
      - name: Chi siamo
        identifier: "about"
        pageRef: "/about"
        weight: 10
      - name: Le basi
        identifier: "assunti_di_base"
        pageRef: "/assunti-di-base"
        weight: 11
      - name: Contatti
        identifier: "contatti"
        url: "/#contactus"
        weight: 15
      - name: Suasì 
        post: "<i class=\"fa-solid fa-arrow-up-right-from-square fa-xs\"></i>"
        identifier: "emcoin"
        url: "https://suasi.it"
        params:
          is_ext: true
  en:
    languageName: English
    languageCode: en-gb
    weight: 2
    title: ResConDA
    # The English site has no articles/tags/classes yet: disable taxonomies so no empty
    # /en/tags/ or /en/classes/ pages are generated. News links to the Italian archive.
    taxonomies: {}
    params:
      reading_speed: 230
      home_title: |
        Conscious  
        action
      slogan: |
        Association for the  
        **RES**tituzione **CON**sapevole   
        del **D**ebito **A**mbientale  
        *Conscious Repayment of Environmental Debt*
      hero_slogan: |
        The **RES**conda association  
        for the **CON**scious repayment  
        of the environmental **D**ebt
      seo_home_title: "ResConDA – The energy cost of everyday choices"
      description: "How much energy is in a can, a flight, a plate of pasta? ResConDA measures the impact of everyday choices in kWh, with numbers and sources."
    menus:
      main:
      - name: Home
        identifier: "home"
        pageRef: "/"
        weight: 1
      - name: About us
        identifier: "about"
        pageRef: "/about"
        weight: 10
      - name: The basics
        identifier: "assunti_di_base"
        pageRef: "/assunti-di-base"
        weight: 11
      - name: Contact
        identifier: "contatti"
        url: "/en/#contactus"
        weight: 15
      - name: News (IT)
        identifier: "articles"
        url: "/articles"
        weight: 20
      - name: Suasì 
        post: "<i class=\"fa-solid fa-arrow-up-right-from-square fa-xs\"></i>"
        identifier: "emcoin"
        url: "https://suasi.it"
        params:
          is_ext: true

taxonomies:
  tag: tags
  class: classes

related:
  includeNewer: true
  threshold: 1
  toLower: true
  indices:
  - name: tags
    weight: 100

DefaultContentLanguage: it
# Italian stays at the site root (/about, /statuto...), English lives under /en/
defaultContentLanguageInSubdir: false
enableRobotsTXT: true

security:
  allowContent: ["^text/markdown$", "^text/html$"]
